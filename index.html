          <h1>Maranatha Papelería Creativa | Eventos y Empaques en Cali</h1>
          <p>
            Taller artesanal y digital vallecaucano con más de 5 años creando papelería creativa orientada a eventos y marcas en Colombia. Fabricamos stickers personalizados desde solo 50 unidades con 100% de personalización, cajas temáticas tridimensionales, dulceros festivos infantiles, cake toppers multicapa y empaques comerciales con corte milimétrico en vinilo y cartulinas especiales de 220 g/m² a 250 g/m². Ofrecemos cotizaciones directas, entregas rápidas a domicilio y despachos asegurados a más de 30 ciudades de Colombia.
          </p>

          <section id="catalogo">
            <h2>Nuestras Especialidades en Papelería y Empaques</h2>
            
            <h3>1. Stickers y Etiquetas Personalizadas</h3>
            <p>
              Troquelado digital de alta definición en vinilo resistente al agua y papel fotográfico brillante de 135 g/m² desde 50 unidades por referencia.
            </p>
            <ul>
              <li>Stickers en vinilo adhesivo impermeable aptos en botellas y packaging</li>
              <li>Etiquetas troqueladas en papel brillante glossy sobre cajas de regalo</li>
              <li>Stickers en láminas kiss-cut con fácil desprendimiento comercial</li>
            </ul>

            <h3>2. Cajas Temáticas 3D y Dulceros Infantiles</h3>
            <p>
              Estructuras tridimensionales diseñadas en mesas de dulces y recuerdos de celebración familiar con técnicas de relieve multicapa.
            </p>
            <ul>
              <li>Cajas pirámide con apliques 3D y remate de lazo de satín</li>
              <li>Cajas milkbox con ventana de acetato y fondo reforzado</li>
              <li>Cajitas interactivas tipo shaker con lentejuelas y microperlas</li>
            </ul>

            <h3>3. Papelería Empresarial y Comercial</h3>
            <p>
              Soluciones de presentación gráfica destinadas a marcas, tiendas y emprendimientos en propalcote de 300 g/m² con acabados mate o brillante.
            </p>
            <ul>
              <li>Tarjetas de presentación con esquinas redondeadas y reserva UV</li>
              <li>Etiquetas colgantes (hang tags) con perforación en prendas de vestir</li>
              <li>Volantes publicitarios y pendones en lona banner de 13 onzas</li>
            </ul>

            <h3>4. Insumos y Materiales Especializados</h3>
            <p>
              Distribución de vinilos adhesivos por metro, cartulinas perladas libres de ácido y soportes acrílicos transparentes grado alimenticio.
            </p>
            <ul>
              <li>Vinilos adhesivos en colores mates, brillantes y metalizados</li>
              <li>Cartulinas Sirio Pearl y cartulinas escarchadas glitter sin desprendimiento</li>
              <li>Varillas y bases acrílicas transparentes destinadas a cake toppers</li>
            </ul>
          </section>

          <ol>
            <li>
              <strong>¿Cuál es la cantidad mínima de stickers personalizados?</strong>
              El pedido mínimo es desde 50 unidades por diseño en vinilo o papel fotográfico.
            </li>
            <li>
              <strong>¿Cuáles son los tiempos de entrega promedio?</strong>
              El tiempo estándar de producción es de 3 a 5 días hábiles tras confirmar el diseño y el anticipo.
            </li>
            <li>
              <strong>¿Hacen envíos a otras ciudades de Colombia?</strong>
              Sí, realizamos envíos nacionales certificados a Bogotá, Medellín, Barranquilla y todo el país.
            </li>
